services:
  nginx:
    container_name: nginx-flashcard
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    command: '/bin/sh -c ''while :; do sleep 720h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    networks:
      - flashcard-network

  certbot:
    container_name: certbot-flashcard
    image: certbot/certbot:v5.2.2
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # --- BACKEND CLUSTER ---
  backend-1:
    build: ./backend
    container_name: backend-1
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - SERVER_ID=1
    networks:
      flashcard-network:
        aliases:
          - backend

  backend-2:
    build: ./backend
    container_name: backend-2
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - SERVER_ID=2
    networks:
      flashcard-network:
        aliases:
          - backend

  # --- SOCKET CLUSTER ---
  socket:
    build: ./socket
    container_name: socket-1
    restart: unless-stopped
    env_file:
      - ./socket/.env.production
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-1
    networks:
      - flashcard-network

  # --- AI CLUSTER ---
  # ai-python-1:
  #   build: ./ai-python
  #   container_name: ai-python-1
  #   restart: unless-stopped
  #   networks:
  #     - flashcard-network

  # ai-python-2:
  #   build: ./ai-python
  #   container_name: ai-python-2
  #   restart: unless-stopped
  #   networks:
  #     - flashcard-network

networks:
  flashcard-network:
    driver: bridge
