services:
  nginx:
    container_name: nginx-flashcard
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    command: '/bin/sh -c ''while :; do sleep 720h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    networks:
      - flashcard-network

  certbot:
    container_name: certbot-flashcard
    image: certbot/certbot:v5.2.2
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
    networks:
      - flashcard-network
    deploy:
      replicas: 2

  socket:
    build: ./socket
    restart: unless-stopped
    env_file:
      - ./socket/.env.production
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - flashcard-network
    deploy:
      replicas: 2

  ai-python:
    build: ./ai-python
    restart: unless-stopped
    networks:
      - flashcard-network
    deploy:
      replicas: 2

networks:
  flashcard-network:
    driver: bridge
